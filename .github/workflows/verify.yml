name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install native PDF and QR test tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils libzbar0
      - name: Install real generator and test dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r btc_envelope_maker/requirements-runtime.txt -r btc_envelope_maker/requirements-test.txt
      - name: Public-vector generator and database security tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: python -B -m pytest -p no:cacheprovider --basetemp "$TMPDIR/generator-tests" btc_envelope_maker/tests -q
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked website dependencies
        run: python -m pip install --require-hashes -r bitcoin4funsite/requirements.txt
      - name: Website unit and UI contract tests
        run: python -m unittest discover -s bitcoin4funsite/tests -v
      - name: Compile application
        run: python -m compileall -q bitcoin4funsite scripts
      - name: Publication guard regression controls
        run: python bitcoin4funsite/tests/check_publication_guard.py
      - name: Build deployment image
        run: docker build -f bitcoin4funsite/Dockerfile -t bitcoin4fun:ci .
